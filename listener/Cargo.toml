[package]
name        = "listener"
description = "Receive byte-oriented data streams from serial and network connections"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
rust-version.workspace = true

[[bin]]
name = "listener"
path = "src/main.rs"

# Flash-free GUI launcher: a Windows "windows" subsystem app (no console allocated
# on double-click). The `listener` binary above stays a console app for terminal
# CLI/headless use; this one is just the desktop GUI entry point. See
# src/bin/listener-gui.rs.
[[bin]]
name = "listener-gui"
path = "src/bin/listener-gui.rs"

[dependencies]

# Error handling (application-level)
anyhow = { workspace = true }

# Library-style typed errors for the core data model (shared error enums, §95)
thiserror = { workspace = true }

# Channel / display-view / config identifiers (§129, §80.1)
uuid = { workspace = true }

# Async runtime + cooperative cancellation (ADR-001 / spec §97.1, §111)
tokio = { workspace = true }
tokio-util = { workspace = true }

# Serial port I/O — runs on a dedicated OS thread (ADR-001 / spec §97.1)
serialport = { workspace = true }

# Calendar time for time-based recording-file rotation (§59) — UTC period keys
chrono = { workspace = true }

# Raw socket options: SO_RCVBUF to mitigate kernel UDP drops (§167, §101)
socket2 = { workspace = true }

# Filesystem free space for the recording disk-space guard (§168, §56.2)
fs4 = { workspace = true }

# async methods in the recorder traits (§142)
async-trait = { workspace = true }

# Profile schema serialization (TOML) — §72
serde = { workspace = true }
toml = { workspace = true }

# CLI argument parsing (thin presentation layer, §3)
clap = { workspace = true }

# GUI presentation layer (§3). eframe/egui share a minor version; the GUI thread
# is a thin layer that exchanges commands/updates with the async runtime over
# channels and never blocks or does I/O (AGENTS §5, listener ADR-008).
eframe = { workspace = true }
egui = { workspace = true }
# Native file/folder picker for the recording-destination "Browse…" button.
rfd = { workspace = true }

# Diagnostic logging (§114) — tracing facade + env-filtered subscriber
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Windows console handling for the GUI (§3): the binary stays a console-subsystem
# app so the headless CLI works when run from a terminal, and the GUI path detaches
# the console (FreeConsole) so a double-click doesn't leave an empty console window.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[dev-dependencies]
# Integration tests (listener/tests/) drive the runtime over loopback sockets.
tokio = { workspace = true }
