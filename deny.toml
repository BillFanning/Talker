# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Enforced in CI: dependency licenses, security advisories, and crate sources.
# Run locally with: cargo deny check

[graph]
# Check the dependency graph across all features (the GUI pulls extra deps).
all-features = true

[advisories]
# RustSec advisory DB. Vulnerabilities fail by default; unmaintained/yanked warn.
# Add advisory IDs here (with a note) only to consciously accept a known issue.
ignore = []

[licenses]
# Allow-list every license actually present in the tree (verified with
# `cargo deny list`). Anything not listed fails — so a new dependency on a
# copyleft/unknown license is caught in CI. There are currently no copyleft-only
# deps: the GPL/LGPL crates (self_cell, unescaper, r-efi) are all dual-licensed
# with a permissive option, satisfied by MIT/Apache below.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",       # serialport, option-ext (weak, file-level copyleft — fine as a dep)
    "Unicode-3.0",   # icu_*, unicode-ident
    "Zlib",
    "OFL-1.1",          # egui's bundled default fonts (epaint_default_fonts)
    "Ubuntu-font-1.0",  # ditto
]
confidence-threshold = 0.8

[bans]
# The Windows/GUI stack pulls many transitive duplicate versions (windows-sys,
# socket2, thiserror, rustix, getrandom, …) that we can't dedupe ourselves —
# surface them as warnings rather than failing the build.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only crates.io — no git or unknown registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
